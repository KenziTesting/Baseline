<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>Baseline — offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100dvh; display: grid; place-items: center; padding: 2rem;
        background: #0b0b0d; color: #f5f5f4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .wrap { max-width: 20rem; }
      img { width: 84px; height: 84px; border-radius: 20px; margin: 0 auto 1.5rem; display: block; }
      h1 { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.01em; }
      p { margin-top: 0.6rem; font-size: 0.9rem; line-height: 1.5; color: rgba(245,245,244,0.55); }
      button {
        margin-top: 1.75rem; width: 100%; min-height: 52px; border: 0; border-radius: 16px;
        background: #f4a52b; color: #0b0b0d; font-size: 1rem; font-weight: 700; cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img src="/icon.svg" alt="Baseline" />
      <h1>You're offline</h1>
      <p>Baseline can't reach the network right now. Your logged data is saved on this device — reconnect to sync and open the full app.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
